- id: TS-192
  fact: 'European record overview (per Wikipedia ''Trabzonspor in European football'', overall record table as of 20 August
    2026): UEFA Champions League/European Cup 10 campaigns (30 matches, 10W 8D 12L, GF25 GA36); UEFA Europa League 11 campaigns
    (60 matches, 24W 11D 25L, GF70 GA71); UEFA Conference League 3 campaigns (8 matches, 1W 4D 3L, GF7 GA12); Cup Winners''
    Cup 3 campaigns (12 matches, 4W 4D 4L, GF13 GA18); UEFA Cup 11 campaigns (38 matches, 14W 11D 13L, GF60 GA61); UEFA Intertoto
    Cup 2 campaigns (8 matches, 3W 1D 4L, GF19 GA12). Grand total: 39 campaigns, 156 matches, 56W 39D 61L (GF194 GA210). Club
    coefficient: 11,000 (140th in Europe as of November 2026; was 118th in 2024-25). Best European results: 1976 home win
    vs Liverpool (European Cup); 1990 home win vs Barcelona (Cup Winners'' Cup); 1991-92 UEFA Cup round of 16; 2011 away win
    at Inter Milan (Champions League group); 2013-14 undefeated EL group winners. 2013-14 undefeated EL group winners.'
  topic: honours_summary
  source: https://tr.wikipedia.org/wiki/Trabzonspor%27un_Avrupa_kupalar%C4%B1_tarihi
