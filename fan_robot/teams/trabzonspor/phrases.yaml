# Short spoken lines per fan moment (Turkish). Recorded once with the AI voice on the settings page.
# {team} = team name. Keep them short (1-2 seconds), friendly, never insulting.
goal_us:
  - "GOOOOL! Bu nasıl gol be!"
  - "Gol! Gol! Gol! {team}!"
  - "Ooo, yıkıldı ortalık! Gol!"
goal_them:
  - "Olamaz... Nasıl yedik bunu?"
  - "Uyanın arkadaşlar, uyanın!"
  - "Of ya... Neyse, daha bitmedi."
chance_us:
  - "Ooo! Az kalsın!"
  - "Direk! Ya, olmadı!"
chance_them:
  - "Eyvah, eyvah!"
  - "Kurtardık... Kalbim duracaktı."
penalty_us:
  - "Penaltı! Hadi, hadi!"
  - "Bakamıyorum... Hadi!"
penalty_them:
  - "Penaltı mı? Bu penaltı değil ki!"
  - "Kurtar, kurtar, kurtar!"
red_card_us:
  - "Kırmızı mı? Hakem, ne yapıyorsun?"
red_card_them:
  - "Kırmızı! Hak etti ama."
referee:
  - "Hakem! Düdüğü çal artık!"
  - "Penaltı bu, penaltı!"
  - "Hakem bey, VAR'a bir baksanıza!"
var:
  - "VAR'a gidiyor... Dayanamıyorum."
tension:
  - "Hadi be! Hadi!"
  - "Bas, bas, bas!"
win:
  - "Kazandık! Bu gece uyumak yok!"
  - "Üç puan bizim! {team}!"
draw:
  - "Bir puan, bir puandır."
  - "Berabere... İdare eder."
loss:
  - "Kaybettik... Bugün konuşmayalım."
  - "Üzgünüm. Ama {team} hep ayağa kalkar."
chant_intro:
  - "Hep beraber!"
  - "Tribünler, sesinizi duyalım!"
groan:
  - "Of ya..."
  - "Hayır ya, olmadı..."
var_cancel_us:
  - "Golümüzü iptal ettiler! Olamaz!"
  - "VAR yine bizi buldu..."
var_cancel_them:
  - "İptal! Oh be, nefes aldım!"
  - "Gol yok! VAR, seni seviyorum!"
halftime:
  - "Devre arası! Çaylar benden."
  - "İlk yarı bitti. Biraz nefes alalım."
# Robotun kendiliğinden yaptığı teklifler (telefonda Evet/Hayır çıkar).
offer_joke:
  - "Moraller biraz bozuk. Size bir fıkra anlatayım mı?"
  - "Bir Temel fıkrası iyi gelir. Anlatayım mı?"
offer_quiz:
  - "Devre arasında küçük bir bilgi yarışması yapalım mı?"
offer_music:
  - "Bu güzel havada biraz müzik açayım mı?"
music_intro:
  - "Müzik geliyor, kalkın bakalım!"
match_intro:
  - "Şu anı hatırlıyor musunuz? Dinleyin!"
quiz_intro:
  - "Bilgi yarışması başlıyor! Telefonlarınızı hazırlayın."
quiz_right:
  - "Doğru cevap! Helal olsun!"
  - "Bildiniz! Gerçek taraftarsınız."
quiz_wrong:
  - "Olmadı... Doğru cevap ekranda."
  - "Yanlış! Ama dert etmeyin, ben de ilk seferde bilememiştim."
quiz_nobody:
  - "Kimse cevap vermedi mi? Ben söyleyeyim."
quiz_results:
  - "Yarışma bitti! Kazananı alkışlayalım!"
quiz_empty:
  - "Henüz sorum yok. Önce soruları yükleyin."
