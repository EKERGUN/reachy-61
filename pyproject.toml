[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my_app"
version = "0.1.0"
description = "A Reachy Mini app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini>=1.11",
    "numpy",
    "scipy",
    "onnxruntime",        # speech detector (one thread; see my_app/vad.py)
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
my_app = "my_app.main:MyApp"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["my_app*"]

[tool.setuptools.package-data]
my_app = ["**/*"]   # also ship static/ and models/
