[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fan_robot"
version = "0.1.0"
description = "A football fan Reachy Mini that shares the room's mood"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini>=1.11",
    "numpy",
    "scipy",
    "onnxruntime",        # speech detector (one thread; see fan_robot/vad.py)
    "pyyaml",             # team packs
    "google-genai",       # recording the voice lines (Gemini TTS)
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
fan_robot = "fan_robot.main:FanRobot"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["fan_robot*"]

[tool.setuptools.package-data]
fan_robot = ["**/*"]   # also ship static/ and models/
